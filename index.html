<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASK KODA</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: light grey;
        }
        .header {
            background-color: black;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .logo span {
            color: babyblue;
            filter: none; /* Ensure no blur effect */
        }
        .nav-links {
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }
        .separator {
            color: white;
            margin: 0 10px;
        }
        .main-content {
            margin-top: 200px;
        }
        .textbox {
            width: 60%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            outline: none;
        }
        .textbox::placeholder {
            color: light gray;
        }
        .response {
            margin-top: 30px;
            font-size: 18px;
            text-align: center;
            padding: 10px;
            background-color: #f1f1f1;
            border-radius: 10px;
        }
        .question {
            font-weight: bold;
        }
        .answer {
            color: blue;

        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">AS<span>Koda</span></div>
        <div class="nav-links">
            <a href="#">Sign Up</a>
            <span class="separator">|</span>
            <a href="#">Login</a>
        </div>
    </div>

    <div class="main-content">
        <h1>Welcome to ASKODA</h1>

        <!-- Question submission form -->
        <form action="/ask" method="POST">
            <input type="text" name="question" class="textbox" placeholder="Type questions here..." required>
            <input type="submit" value="Ask" style="padding: 10px 20px; border-radius: 25px; background-color: black; color: white; border: none; font-size: 16px; cursor: pointer;">
        </form>

        <!-- Display question and answer after submission -->
        
    </div>

    <!-- Scroll to bottom script -->
    <script>
        // Scroll the page to the bottom after form submission
        window.onload = function() {
            const response = document.querySelector('.response');
            if (response) {
                response.scrollIntoView({ behavior: 'smooth' });
            }
        };
    </script>
</body>
</html>
